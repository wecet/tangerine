services:
  worker:
    build: .
    image: tangerine-worker:local
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TANGERINE_TOKEN: ${TANGERINE_TOKEN:?Run scripts/deploy.sh first}
    init: true
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Disk-backed scratch space: large videos don't consume a RAM-backed tmpfs.
    volumes:
      - scratch:/tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).read()"]
      interval: 120s
      timeout: 3s
      start_period: 5s
      retries: 2
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
volumes:
  scratch:
